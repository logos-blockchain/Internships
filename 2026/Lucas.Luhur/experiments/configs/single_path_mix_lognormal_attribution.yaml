# Single-path sender attribution under the shifted log-normal link law: fix the structural spread
# sigma_d and sweep the mixing noise sigma_Z through the mean delay per mix 1/lambda_M (20-cell ladder).
#   python experiments/run.py single_path_mix_lognormal_attribution
name: single_path_mix_lognormal_attribution

dummy:
  count: 19

latency:
  lognormal:
    floor: 0.0072
    mean: 0.0629
    sd: 0.0333

layer:
  name: single_path_mix
  params:
    hops: 3
    sender_scale: auto
    rho: 4.0
    receiver_delays: False

attack:
  name: bayes_attribution

measures: [deanon_top1, mean_true_posterior, posterior_entropy]

sweep:
  mix_scale:
    path: layer_params.mix_scale
    values: [
      0.0001,
      0.0002,
      0.0003,
      0.00045,
      0.0007,
      0.001,
      0.0014,
      0.0018,
      0.0026,
      0.0037,
      0.0054,
      0.008,
      0.012,
      0.019,
      0.03,
      0.06,
      0.12,
      0.25,
      0.5,
      1.0,
    ]

seed: 0
reps: 50

plots:
  # (a) Top-1 vs 1/eta.
  - x: mix_scale
    xcol: inv_eta
    y: deanon_top1
    errorbar: sem
    hline: auto
    limit: auto
    xlabel: 'Inverse SNR  $1/\eta = \sigma_Z / \sigma_d$   (larger mix delay $\rightarrow$)'
    ylabel: 'Top-1 de-anonymisation  $P_\mathrm{Top1}$'
    out: lognormal_attribution_top1_vs_inv_eta.png

  # (b) Top-1 vs 1/eta with the closed form overlaid: the theory-vs-simulation figure.
  - x: mix_scale
    xcol: inv_eta
    y: deanon_top1
    errorbar: sem
    hline: auto
    limit: auto
    theory: auto
    xlabel: 'Inverse SNR  $1/\eta = \sigma_Z / \sigma_d$   (larger mix delay $\rightarrow$)'
    ylabel: 'Top-1 de-anonymisation  $P_\mathrm{Top1}$'
    out: lognormal_attribution_top1_theory_vs_sim.png

  # (c) true-sender posterior vs 1/eta.
  - x: mix_scale
    xcol: inv_eta
    y: mean_true_posterior
    errorbar: sem
    hline: auto
    limit: auto
    xlabel: 'Inverse SNR  $1/\eta = \sigma_Z / \sigma_d$   (larger mix delay $\rightarrow$)'
    ylabel: 'Mean true-sender posterior  $\overline{P}_{\mathrm{true}}$'
    out: lognormal_attribution_true_posterior_vs_inv_eta.png

  # (d) posterior entropy vs 1/eta.
  - x: mix_scale
    xcol: inv_eta
    y: posterior_entropy
    errorbar: sem
    hline: auto
    limit: auto
    xlabel: 'Inverse SNR  $1/\eta = \sigma_Z / \sigma_d$   (larger mix delay $\rightarrow$)'
    ylabel: 'Posterior entropy  $\overline{H}$  (bits)'
    out: lognormal_attribution_entropy_vs_inv_eta.png

  # (e) latency overhead ell vs eta, with the closed form.
  - x: mix_scale
    xcol: eta
    y: latency_overhead
    errorbar: sem
    theory: auto
    secondary_y: auto
    xlabel: 'SNR  $\eta = \sigma_d / \sigma_Z$   (smaller mix delay $\rightarrow$)'
    ylabel: 'Latency overhead  $\ell = \mathbb{E}[\Delta]/\mathbb{E}[D_{\mathrm{br}}]$'
    out: lognormal_attribution_latency_vs_eta.png

  # (f) Top-1 vs ell.
  - x: mix_scale
    xcol: latency_overhead
    y: deanon_top1
    errorbar: sem
    hline: auto
    limit: auto
    xlabel: 'Latency overhead  $\ell = \mathbb{E}[\Delta]/\mathbb{E}[D_{\mathrm{br}}]$'
    ylabel: 'Top-1 de-anonymisation  $P_\mathrm{Top1}$'
    out: lognormal_attribution_top1_vs_latency.png

  # (g) true-sender posterior vs ell.
  - x: mix_scale
    xcol: latency_overhead
    y: mean_true_posterior
    errorbar: sem
    hline: auto
    limit: auto
    xlabel: 'Latency overhead  $\ell = \mathbb{E}[\Delta]/\mathbb{E}[D_{\mathrm{br}}]$'
    ylabel: 'Mean true-sender posterior  $\overline{P}_{\mathrm{true}}$'
    out: lognormal_attribution_true_posterior_vs_latency.png

  # (h) posterior entropy vs ell.
  - x: mix_scale
    xcol: latency_overhead
    y: posterior_entropy
    errorbar: sem
    hline: auto
    limit: auto
    xlabel: 'Latency overhead  $\ell = \mathbb{E}[\Delta]/\mathbb{E}[D_{\mathrm{br}}]$'
    ylabel: 'Posterior entropy  $\overline{H}$  (bits)'
    out: lognormal_attribution_entropy_vs_latency.png

  # (i) Top-1 vs eta.
  - x: mix_scale
    xcol: eta
    y: deanon_top1
    errorbar: sem
    hline: auto
    limit: auto
    xlabel: 'SNR  $\eta = \sigma_d / \sigma_Z$   (smaller mix delay $\rightarrow$)'
    ylabel: 'Top-1 de-anonymisation  $P_\mathrm{Top1}$'
    out: lognormal_attribution_top1_vs_eta.png

  # (j) true-sender posterior vs eta.
  - x: mix_scale
    xcol: eta
    y: mean_true_posterior
    errorbar: sem
    hline: auto
    limit: auto
    xlabel: 'SNR  $\eta = \sigma_d / \sigma_Z$   (smaller mix delay $\rightarrow$)'
    ylabel: 'Mean true-sender posterior  $\overline{P}_{\mathrm{true}}$'
    out: lognormal_attribution_true_posterior_vs_eta.png

  # (k) posterior entropy vs eta.
  - x: mix_scale
    xcol: eta
    y: posterior_entropy
    errorbar: sem
    hline: auto
    limit: auto
    xlabel: 'SNR  $\eta = \sigma_d / \sigma_Z$   (smaller mix delay $\rightarrow$)'
    ylabel: 'Posterior entropy  $\overline{H}$  (bits)'
    out: lognormal_attribution_entropy_vs_eta.png

  # (l) Top-1 vs eta, log-log.
  - x: mix_scale
    xcol: eta
    y: deanon_top1
    errorbar: sem
    hline: auto
    limit: auto
    xscale: log
    yscale: log
    xlabel: 'SNR  $\eta = \sigma_d / \sigma_Z$   (log scale)'
    ylabel: 'Top-1 de-anonymisation  $P_\mathrm{Top1}$   (log scale)'
    out: lognormal_attribution_top1_vs_eta_loglog.png

  # (m) true-sender posterior vs eta, log-log.
  - x: mix_scale
    xcol: eta
    y: mean_true_posterior
    errorbar: sem
    hline: auto
    limit: auto
    xscale: log
    yscale: log
    xlabel: 'SNR  $\eta = \sigma_d / \sigma_Z$   (log scale)'
    ylabel: 'Mean true-sender posterior  $\overline{P}_{\mathrm{true}}$   (log scale)'
    out: lognormal_attribution_true_posterior_vs_eta_loglog.png

  # (n) posterior entropy vs eta, log-log.
  - x: mix_scale
    xcol: eta
    y: posterior_entropy
    errorbar: sem
    hline: auto
    xscale: log
    yscale: log
    xlabel: 'SNR  $\eta = \sigma_d / \sigma_Z$   (log scale)'
    ylabel: 'Posterior entropy  $\overline{H}$  (bits, log scale)'
    out: lognormal_attribution_entropy_vs_eta_loglog.png

  # (o) Top-1 vs 1/lambda_M.
  - x: mix_scale
    y: deanon_top1
    errorbar: sem
    band: true
    color: hotpink
    marker: none
    hline: auto
    limit: auto
    xscale: log
    legend_loc: 'upper right'
    secondary_x:
      column: latency
      label: 'AC-path delay  $\mathbb{E}[Y]$  (s)'
      ticks: aligned
    xlabel: 'Mean delay per mix  $1/\lambda_M$  (s, log scale)'
    ylabel: 'Top-1 de-anonymisation  $P_\mathrm{Top1}$'
    out: lognormal_attribution_top1_vs_mix_scale.png

  # (p) true-sender posterior vs 1/lambda_M.
  - x: mix_scale
    y: mean_true_posterior
    errorbar: sem
    band: true
    color: hotpink
    marker: none
    hline: auto
    limit: auto
    xscale: log
    legend_loc: 'upper right'
    secondary_x:
      column: latency
      label: 'AC-path delay  $\mathbb{E}[Y]$  (s)'
      ticks: aligned
    xlabel: 'Mean delay per mix  $1/\lambda_M$  (s, log scale)'
    ylabel: 'Mean true-sender posterior  $\overline{P}_{\mathrm{true}}$'
    out: lognormal_attribution_true_posterior_vs_mix_scale.png

  # (q) posterior entropy vs 1/lambda_M.
  - x: mix_scale
    y: posterior_entropy
    errorbar: sem
    band: true
    color: hotpink
    marker: none
    hline: auto
    limit: auto
    xscale: log
    legend_loc: 'lower right'
    secondary_x:
      column: latency
      label: 'AC-path delay  $\mathbb{E}[Y]$  (s)'
      ticks: aligned
    xlabel: 'Mean delay per mix  $1/\lambda_M$  (s, log scale)'
    ylabel: 'Posterior entropy  $\overline{H}$  (bits)'
    out: lognormal_attribution_entropy_vs_mix_scale.png
