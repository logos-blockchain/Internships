# Mix-net width scaling: sender attribution at k = 3 with W = 1..40 (log-uniform ladder) as the series
# and the mean delay per mix 1/lambda_M on the x-axis. W = 1 reproduces the single path exactly.
#   python experiments/run.py mixnet_width_sweep
name: mixnet_width_sweep

dummy:
  count: 19

latency:
  lognormal:
    floor: 0.0072
    mean: 0.0629
    sd: 0.0333

layer:
  name: mixnet
  params:
    width: 2
    hops: 3
    entry_assignment: split
    sender_scale: auto
    rho: 4.0
    receiver_delays: False

attack:
  name: mixnet_attribution

measures: [deanon_top1, mean_true_posterior, posterior_entropy]

sweep:
  width:
    path: layer_params.width
    values: [1, 2, 3, 5, 8, 14, 24, 40]
  mix_scale:
    path: layer_params.mix_scale
    values: [
      0.0001,
      0.0003,
      0.0007,
      0.001,
      0.0018,
      0.0037,
      0.008,
      0.019,
      0.06,
      0.25,
      1.0,
    ]

seed: 0
reps: 30

plots:
  # (a) Top-1 vs 1/eta, one curve per W.
  - x: mix_scale
    xcol: inv_eta
    xscale: log
    series: width
    series_label: '$W = {v:g}$'
    legend_title: 'Mix nodes per layer'
    y: deanon_top1
    errorbar: sem
    hline: auto
    limit: auto
    xlabel: 'Inverse SNR  $1/\eta = \sigma_Z / \sigma_d$   (larger mix delay $\rightarrow$)'
    ylabel: 'Top-1 de-anonymisation  $P_\mathrm{Top1}$'
    out: mixnet_width_top1_vs_inv_eta.png

  # (b) true-sender posterior vs 1/eta, one curve per W.
  - x: mix_scale
    xcol: inv_eta
    xscale: log
    series: width
    series_label: '$W = {v:g}$'
    legend_title: 'Mix nodes per layer'
    y: mean_true_posterior
    errorbar: sem
    hline: auto
    limit: auto
    xlabel: 'Inverse SNR  $1/\eta = \sigma_Z / \sigma_d$   (larger mix delay $\rightarrow$)'
    ylabel: 'Mean true-sender posterior  $\bar P_\mathrm{true}$'
    out: mixnet_width_true_posterior_vs_inv_eta.png

  # (c) posterior entropy vs 1/eta, one curve per W.
  - x: mix_scale
    xcol: inv_eta
    xscale: log
    series: width
    series_label: '$W = {v:g}$'
    legend_title: 'Mix nodes per layer'
    y: posterior_entropy
    errorbar: sem
    hline: auto
    limit: auto
    xlabel: 'Inverse SNR  $1/\eta = \sigma_Z / \sigma_d$   (larger mix delay $\rightarrow$)'
    ylabel: 'Posterior entropy  $\bar H$  (bits)'
    out: mixnet_width_entropy_vs_inv_eta.png

  # (d) latency overhead ell vs eta, one curve per W.
  - x: mix_scale
    xcol: eta
    series: width
    series_label: '$W = {v:g}$'
    legend_title: 'Mix nodes per layer'
    y: latency_overhead
    errorbar: sem
    secondary_y: auto
    xscale: log
    xlabel: 'SNR  $\eta = \sigma_d / \sigma_Z$   (smaller mix delay $\rightarrow$)'
    ylabel: 'Latency overhead  $\ell = \mathbb{E}[\Delta]/\mathbb{E}[D_{\mathrm{br}}]$'
    out: mixnet_width_latency_vs_eta.png

  # (e) Top-1 vs ell, one curve per W.
  - x: mix_scale
    xcol: latency_overhead
    series: width
    series_label: '$W = {v:g}$'
    legend_title: 'Mix nodes per layer'
    y: deanon_top1
    errorbar: sem
    hline: auto
    limit: auto
    xlabel: 'Latency overhead  $\ell = \mathbb{E}[\Delta]/\mathbb{E}[D_{\mathrm{br}}]$'
    ylabel: 'Top-1 de-anonymisation  $P_\mathrm{Top1}$'
    out: mixnet_width_top1_vs_latency.png

  # (f) true-sender posterior vs ell, one curve per W.
  - x: mix_scale
    xcol: latency_overhead
    series: width
    series_label: '$W = {v:g}$'
    legend_title: 'Mix nodes per layer'
    y: mean_true_posterior
    errorbar: sem
    hline: auto
    limit: auto
    xlabel: 'Latency overhead  $\ell = \mathbb{E}[\Delta]/\mathbb{E}[D_{\mathrm{br}}]$'
    ylabel: 'Mean true-sender posterior  $\bar P_\mathrm{true}$'
    out: mixnet_width_true_posterior_vs_latency.png

  # (g) posterior entropy vs ell, one curve per W.
  - x: mix_scale
    xcol: latency_overhead
    series: width
    series_label: '$W = {v:g}$'
    legend_title: 'Mix nodes per layer'
    y: posterior_entropy
    errorbar: sem
    hline: auto
    limit: auto
    xlabel: 'Latency overhead  $\ell = \mathbb{E}[\Delta]/\mathbb{E}[D_{\mathrm{br}}]$'
    ylabel: 'Posterior entropy  $\bar H$  (bits)'
    out: mixnet_width_entropy_vs_latency.png

  # (h) Top-1 vs eta, one curve per W.
  - x: mix_scale
    xcol: eta
    series: width
    series_label: '$W = {v:g}$'
    legend_title: 'Mix nodes per layer'
    y: deanon_top1
    errorbar: sem
    hline: auto
    limit: auto
    xscale: log
    xlabel: 'SNR  $\eta = \sigma_d / \sigma_Z$   (smaller mix delay $\rightarrow$)'
    ylabel: 'Top-1 de-anonymisation  $P_\mathrm{Top1}$'
    out: mixnet_width_top1_vs_eta.png

  # (i) true-sender posterior vs eta, one curve per W.
  - x: mix_scale
    xcol: eta
    series: width
    series_label: '$W = {v:g}$'
    legend_title: 'Mix nodes per layer'
    y: mean_true_posterior
    errorbar: sem
    hline: auto
    limit: auto
    xscale: log
    xlabel: 'SNR  $\eta = \sigma_d / \sigma_Z$   (smaller mix delay $\rightarrow$)'
    ylabel: 'Mean true-sender posterior  $\bar P_\mathrm{true}$'
    out: mixnet_width_true_posterior_vs_eta.png

  # (j) posterior entropy vs eta, one curve per W.
  - x: mix_scale
    xcol: eta
    series: width
    series_label: '$W = {v:g}$'
    legend_title: 'Mix nodes per layer'
    y: posterior_entropy
    errorbar: sem
    hline: auto
    limit: auto
    xscale: log
    xlabel: 'SNR  $\eta = \sigma_d / \sigma_Z$   (smaller mix delay $\rightarrow$)'
    ylabel: 'Posterior entropy  $\bar H$  (bits)'
    out: mixnet_width_entropy_vs_eta.png

  # (k) Top-1 vs W, one curve per mixing budget (subset).
  - x: width
    series: mix_scale
    series_values: [0.0003, 0.001, 0.008, 0.06, 1.0]
    series_label: 'mix $= {v:g}$ s'
    legend_title: 'Mean delay per mix  $1/\lambda_M$'
    y: deanon_top1
    errorbar: sem
    hline: auto
    limit: auto
    xticks: [1, 2, 3, 5, 8, 14, 24, 40]
    xlabel: 'Mix nodes per layer  $W$   (routes per sender $= W^{L-1}$)'
    ylabel: 'Top-1 de-anonymisation  $P_\mathrm{Top1}$'
    out: mixnet_width_top1_vs_W.png

  # (l) posterior entropy vs W, one curve per mixing budget (subset).
  - x: width
    series: mix_scale
    series_values: [0.0003, 0.001, 0.008, 0.06, 1.0]
    series_label: 'mix $= {v:g}$ s'
    legend_title: 'Mean delay per mix  $1/\lambda_M$'
    y: posterior_entropy
    errorbar: sem
    hline: auto
    limit: auto
    xticks: [1, 2, 3, 5, 8, 14, 24, 40]
    xlabel: 'Mix nodes per layer  $W$   (routes per sender $= W^{L-1}$)'
    ylabel: 'Posterior entropy  $\bar H$  (bits)'
    out: mixnet_width_entropy_vs_W.png

  # (m) Excess of Top-1 over its reference line vs W, one curve per mixing budget (subset).
  - x: width
    series: mix_scale
    series_values: [0.0001, 0.001, 0.008, 0.06]
    series_label: 'mix $= {v:g}$ s'
    legend_title: 'Mean delay per mix  $1/\lambda_M$'
    y: deanon_top1
    ytransform: excess
    hline: auto
    errorbar: sem
    xticks: [1, 2, 3, 5, 8, 14, 24, 40]
    xlabel: 'Mix nodes per layer  $W$'
    ylabel: 'Excess over the null  $P_\mathrm{Top1} - \mathbb{E}[1/|S_t|]$'
    out: mixnet_width_top1_excess_vs_W.png

  # (n) Top-1 vs 1/lambda_M, one curve per W (subset).
  - x: mix_scale
    series: width
    series_values: [1, 2, 3, 14, 40]
    series_label: '$W = {v:g}$'
    legend_title: 'Mix nodes per layer  $W$'
    legend_loc: 'upper right'
    cmap: plasma
    band: true
    marker: none
    y: deanon_top1
    errorbar: sem
    hline: auto
    limit: auto
    xscale: log
    xlabel: 'Mean delay per mix  $1/\lambda_M$  (s, log scale)'
    ylabel: 'Top-1 de-anonymisation  $P_\mathrm{Top1}$'
    out: mixnet_width_top1_vs_mix_scale.png
